/* ---------- ステージ生成 ---------- */
function build(seed){
 const r=rng(seed),R=(a,b)=>a+r()*(b-a),I=(a,b)=>Math.floor(R(a,b+.999)),pick=a=>a[I(0,a.length-1)];

 const win=(wx,wy)=>{rect(wx-6,wy-6,132,172,'#fff');let q=x.createLinearGradient(0,wy,0,wy+160);q.addColorStop(0,'#6fb6ff');q.addColorStop(1,'#d6efff');x.fillStyle=q;x.fillRect(wx,wy,120,160);rect(wx+57,wy,6,160,'#fff');rect(wx,wy+77,120,6,'#fff');const cl=pick(COL);rect(wx-22,wy-10,26,185,cl);rect(wx+116,wy-10,26,185,cl)};
 const clock=(a,b)=>{circ(a,b,36,'#5a3b22');circ(a,b,30,'#fff');x.strokeStyle='#222';x.lineWidth=4;x.beginPath();x.moveTo(a,b);x.lineTo(a+R(-18,18),b-20);x.moveTo(a,b);x.lineTo(a+22,b+R(-8,8));x.stroke()};
 const bookcase=(bx,fy)=>{rect(bx,fy-250,130,250,'#6b4423');rect(bx+8,fy-242,114,234,'#3b2412');for(let s=0;s<4;s++){const sy=fy-242+s*58;rect(bx+8,sy+54,114,5,'#8a5a30');let a=bx+10;while(a<bx+116){const w=I(7,15),h=I(30,50);rect(a,sy+54-h,w,h,pick(COL));a+=w+1}}};
 const sofa=(bx,fy)=>{const cl=pick(COL);rect(bx,fy-92,170,50,cl);rect(bx-14,fy-62,30,62,cl);rect(bx+154,fy-62,30,62,cl);rect(bx+14,fy-50,142,50,cl);rect(bx+84,fy-50,3,50,'#0003');rect(bx+10,fy,10,8,'#333');ow.push([bx+14,fy-50,142,6])};
 const plant=(bx,fy)=>{rect(bx+40,fy-50,50,50,'#b5651d');for(let j=0;j<7;j++)circ(bx+65+R(-40,40),fy-R(70,170),R(18,32),pick(['#2e7d32','#43a047','#1b5e20']))};
 const lamp=(bx,fy)=>{rect(bx+62,fy-190,6,190,'#333');rect(bx+40,fy-8,50,8,'#333');x.fillStyle=pick(['#ffe08a','#ffb3c1','#b8e0ff']);x.beginPath();x.moveTo(bx+35,fy-160);x.lineTo(bx+95,fy-160);x.lineTo(bx+80,fy-215);x.lineTo(bx+50,fy-215);x.fill()};

 const rug=(bx,fy)=>{x.fillStyle=pick(COL);x.beginPath();x.ellipse(bx+80,fy-6,90,10,0,0,7);x.fill()};
 const fl=[bookcase,sofa,plant,lamp,fridge,table,rug,bookcase];
 for(let i=0;i<3;i++){const fy=YF[i],ty=fy-400;
  for(let k=0;k<6;k++){const x0=k?k*600:40,x1=Math.min(k*600+600,WW-40);

  seg(p,WW-40)}
 rect(0,YF[0],WW,60,'#3b5d2a');sol.push([0,YF[0],WW,60]);
 rect(0,80,40,1440,'#8b3a2a');rect(WW-40,80,40,1440,'#8b3a2a');sol.push([0,80,40,1440],[WW-40,80,40,1440]);

/* ---------- 棒人間 ---------- */
const SEG=[[0,1],[1,2],[1,3],[3,4],[1,5],[5,6],[0,7],[7,8],[0,9],[9,10]];
function pts(a){const h=[100,130],s=[100,86],P=[h,s,[100,64]],lim=(o,t,l)=>[o[0]+Math.sin(t)*l,o[1]+Math.cos(t)*l];

 if(a==1)return[s*.9,s*.9+.8,-s*.9,-s*.9+.8,s*.8,Math.min(0,s*.8)-.2,-s*.8,Math.min(0,-s*.8)-.2];

/* ---------- 物理 ---------- */
const hitS=(x,y)=>{const a=x-13,b=x+13,c=y-124;for(const r of ST.sol)if(a<r[0]+r[2]&&b>r[0]&&c<r[1]+r[3]&&y>r[1])return r;return null};

 const dir=ix>.3?1:ix<-.3?-1:0,tl=hitS(m.x-3,m.y-2),tr=hitS(m.x+3,m.y-2),cl=(dir<0&&tl)||(dir>0&&tr);

 else if(cl){m.vy=iy*230;m.vx=0;if(jp){m.vy=-620;m.vx=-dir*340}}
 else{m.vy=Math.min(m.vy+1900*dt,1200);if(!(m.vx&&!m.g&&Math.abs(m.vx)>300&&!ix))m.vx=m.g?ix*300:m.vx+(ix*300-m.vx)*Math.min(1,dt*8);if(jp&&m.g)m.vy=-650}

 m.x+=m.vx*dt;let r=hitS(m.x,m.y);if(r){m.x=m.vx>0?r[0]-13:r[0]+r[2]+13}

 if(r){if(m.vy>0){m.y=r[1];m.g=true}else m.y=r[1]+r[3]+124;m.vy=0}
 else if(m.vy>=0)for(const o of ST.ow)if(m.x>o[0]-13&&m.x<o[0]+o[2]+13&&py<=o[1]+2&&m.y>=o[1]){m.y=o[1];m.vy=0;m.g=true;break}
 m.x=Math.max(53,Math.min(WW-53,m.x));m.a=cl?3:!m.g?2:Math.abs(m.vx)>20?1:0}

/* ---------- 状態・通信 ---------- */
let peer,hc,room='',base='',me=null,P={},conns={},ph='menu',rem=0,seed=0,ST=null,ban='',banT=0,H={looks:{},cEnd:0,end:0};

function join(){
 const nm=$('nm').value.trim()||'ぷれいやー'+(10+Math.random()*89|0);localStorage.mckrN=nm;

 me=newP('',nm);me.hide=mkc();me.av=mkc();$('menu').style.display='none';$('err').textContent='';asHost()}
function asHost(){

 peer.on('open',id=>{me.id=id;me.host=1;P[id]=me;ph='lobby';seed=1;ST=build(1);rem=0;banner('あなたがホストです。人が集まったら開始！',4000);setInterval(hostTick,100);setInterval(upl,66)});
 peer.on('connection',c=>{c.on('open',()=>{conns[c.peer]=c});c.on('data',m=>onHost(c.peer,m));c.on('close',()=>{delete conns[c.peer];delete P[c.peer];chk()})});
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();asClient()}else err(e.type)})}
function asClient(){
 peer=new Peer(undefined,{config:ICE});
 peer.on('open',id=>{me.id=id;P={};P[id]=me;hc=peer.connect(base,{reliable:true});
  hc.on('open',()=>{hc.send({t:'hi',n:me.n});ph='lobby';seed=1;ST=build(1);banner('ホストが開始するのを待ってね',4000);setInterval(upl,66)});
  hc.on('data',onMsg);hc.on('close',()=>{alert('ホストとの接続が切れました');location.reload()})});
 peer.on('error',e=>{if(e.type==='peer-unavailable'){peer.destroy();setTimeout(asHost,700)}else err(e.type)})}
const upl=()=>{if(me&&me.id&&!me.host)send({t:'u',x:me.x,y:me.y,f:me.f,a:me.a,fx:me.fx})};
const snap=()=>{const o={};for(const id in P){const p=P[id];o[id]=[p.n,p.x,p.y,p.f,p.a,p.fx,p.r]}return o};
function chk(){if(ph!=='lobby'&&Object.keys(P).length<2)toLobby('人数が足りないので中止')}
function startGame(){
 const ids=Object.keys(P);if(ph!=='lobby'||ids.length<2)return;
 ids.sort(()=>Math.random()-.5);const k=Math.max(1,Math.floor(ids.length/4)),roles={};
 ids.forEach((id,i)=>roles[id]=i<k?'s':'h');
 H.end=performance.now()+60000;emit({t:'ph',ph:'paint',rem:60,seed:1+(Math.random()*1e6|0),roles})}
function startHunt(){H.end=performance.now()+240000;emit({t:'ph',ph:'hunt',rem:240,looks:H.looks})}
const toLobby=s=>emit({t:'ph',ph:'lobby',rem:0,msg:s||'ホストの開始を待っています'});
function hostTick(){const now=performance.now();
 if(ph!=='lobby'&&ph!=='menu')rem=Math.max(0,(H.end-now)/1000);
 if(ph==='paint'&&rem<=0){H.looks={};H.cEnd=now+3000;emit({t:'ph',ph:'collect',rem:0})}
 else if(ph==='collect'&&now>H.cEnd)startHunt();
 else if(ph==='hunt'){if(!Object.values(P).some(p=>p.r==='h')){H.end=now+7000;emit({t:'ph',ph:'end',rem:7,msg:'鬼の勝ち！全員見つけた！'})}
  else if(rem<=0){H.end=now+25000;emit({t:'ph',ph:'reveal',rem:25,msg:'時間切れ！隠れた人の勝ち！'})}}
 else if((ph==='reveal'||ph==='end')&&rem<=0)toLobby();
 bc({t:'s',ph,rem,seed,p:snap()})}
function onHost(id,m){const p=P[id];
 if(m.t==='hi'){P[id]=newP(id,m.n);return}
 if(!p)return;
 if(m.t==='u'){if(id!==me.id){p.tx=m.x;p.ty=m.y;p.f=m.f;p.a=m.a;p.fx=m.fx;if(Math.abs(p.x-m.x)>400||Math.abs(p.y-m.y)>400){p.x=m.x;p.y=m.y}}}
 else if(m.t==='look'&&ph==='collect'){H.looks[id]=Object.assign(m,{id});if(Object.values(P).every(q=>!q.r||H.looks[q.id]))startHunt()}
 else if(m.t==='av'){m.id=id;emit(m)}
 else if(m.t==='shoot')shoot(id,m)}
function shoot(id,m){const sh=P[id];if(!sh||sh.r!=='s'||ph!=='hunt')return;let hit=0;
 for(const q of Object.values(P)){if(q.r!=='h')continue;const l=H.looks[q.id];if(!l)continue;const b=bbox(l),dx=Math.max(b[0]-m.x,0,m.x-b[2]),dy=Math.max(b[1]-m.y,0,m.y-b[3]);
  if(dx*dx+dy*dy<2300){hit=1;emit({t:'hit',id:q.id,by:sh.n,n:q.n})}}
 if(!hit){if(id===me.id)cd=3.2;else if(conns[id])conns[id].send({t:'miss'})}}
const loadImg=(s,cb)=>{const im=new Image();im.onload=()=>cb(im);im.src=s};
const spawn=()=>{me.x=1650+Math.random()*300;me.y=YF[0];me.vx=me.vy=0;me.fx=0};
function onMsg(m){
 if(m.t==='s'){if(!me.host){ph=m.ph;rem=m.rem;if(m.seed!==seed){seed=m.seed;ST=build(seed)}
   for(const id in m.p){const q=m.p[id],p=P[id]||(P[id]=newP(id,q[0]));if(p!==me){p.n=q[0];p.tx=q[1];p.ty=q[2];p.f=q[3];p.a=q[4];p.fx=q[5];if(Math.abs(p.x-q[1])>400){p.x=q[1];p.y=q[2]}}p.r=q[6]}
   for(const id in P)if(!m.p[id])delete P[id]}}
 else if(m.t==='ph'){ph=m.ph;rem=m.rem;if(m.seed&&m.seed!==seed){seed=m.seed;ST=build(seed)}if(m.msg)banner(m.msg,5000);
  if(ph==='paint'){for(const id in P)P[id].r=m.roles[id]||'';edOpen=false;me.pi=0;me.pose=STAND;me.hide.getContext('2d').clearRect(0,0,200,240);spawn();Z=3;
   banner(me.r==='s'?'あなたは鬼！いまのうちにアバターを描こう':'あなたは隠れる側！場所を決めて「固定」→お絵描き！',5000)}
  else if(ph==='collect'){if(me.r==='h')me.fx=1;if(me.r)send({t:'look',h:me.r==='h',pose:me.pose,f:me.f,x:me.x,y:me.y,img:(me.r==='h'?me.hide:me.av).toDataURL()})}
  else if(ph==='hunt'){for(const id in m.looks){const l=m.looks[id],p=P[id];if(!p)continue;if(l.h){p.pose=l.pose;p.x=p.tx=l.x;p.y=p.ty=l.y;p.f=l.f;p.fx=1}loadImg(l.img,im=>{p[l.h?'img':'imgAv']=im})}
   if(me.r==='s')spawn();banner(me.r==='s'?'隠れた人を探して、タップで撃て！':'じっとして、見つからないように…',4000)}
  else if(ph==='lobby'){for(const id in P){P[id].r='';P[id].fx=0}spawn();edOpen=false}}
 else if(m.t==='hit'){const p=P[m.id];if(p){p.r='s';p.fx=0}banner(m.n+' が見つかった！',3000);
  if(m.id===me.id){me.r='s';me.fx=0;send({t:'av',img:me.av.toDataURL()});banner('見つかった！あなたも鬼になった',4000)}}
 else if(m.t==='av'){const p=P[m.id];if(p)loadImg(m.img,im=>{p.imgAv=im})}
 else if(m.t==='miss')cd=3.2}

/* ---------- 入力 ---------- */
const stk=$('stk');let sid=null;
const sp=e=>{const b=stk.getBoundingClientRect(),dx=e.clientX-(b.left+75),dy=e.clientY-(b.top+75),l=Math.hypot(dx,dy)||1,m=Math.min(l,60);inp.x=dx/l*m/60;inp.y=dy/l*m/60;stk.firstChild.style.transform=`translate(${dx/l*m}px,${dy/l*m}px)`;if(Math.abs(inp.x)<.15)inp.x=0};
stk.addEventListener('pointerdown',e=>{sid=e.pointerId;stk.setPointerCapture(sid);sp(e)});
stk.addEventListener('pointermove',e=>{if(e.pointerId===sid)sp(e)});
const sup=e=>{if(e.pointerId===sid){sid=null;inp.x=inp.y=0;stk.firstChild.style.transform=''}};
stk.addEventListener('pointerup',sup);stk.addEventListener('pointercancel',sup);
$('jb').addEventListener('pointerdown',()=>jmp=true);
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')kx=-1;if(k==='ArrowRight'||k==='d')kx=1;if(k==='ArrowUp'||k==='w')ky=-1;if(k==='ArrowDown'||k==='s')ky=1;if(k===' ')jmp=true});
addEventListener('keyup',e=>{const k=e.key;if('ArrowLeft a ArrowRight d'.split(' ').includes(k))kx=0;if('ArrowUp w ArrowDown s'.split(' ').includes(k))ky=0});
const toW=(sx,sy)=>[(sx-W_/2)/CAM.k+CAM.x,(sy-H_/2)/CAM.k+CAM.y];
const isEd=()=>(ph==='lobby'&&edOpen)||(ph==='paint'&&me.r==='s');
const isPm=()=>ph==='paint'&&me.r==='h'&&!!me.fx;
const tgt=()=>isPm()?me.hide:me.av;
function ptr(e,mv){
 if(isEd()||isPm()){
  const w=toW(e.clientX,e.clientY),pm=isPm(),an=pm?[me.x,me.y,me.f]:[0,62,1],pose=pm?me.pose:STAND,L=figL(pts(pose));
  const s=[100+(w[0]-an[0])/(S*an[2]),L+(w[1]-an[1])/S],c=tgt(),x=c.getContext('2d');
  if(tool==='d'){let rgb;if(pm){const d=ST.x.getImageData(Math.max(0,Math.min(WW-5,w[0]-2))|0,Math.max(0,Math.min(WH-5,w[1]-2))|0,5,5).data;let a=[0,0,0];for(let i=0;i<100;i+=4){a[0]+=d[i];a[1]+=d[i+1];a[2]+=d[i+2]}rgb=a.map(v=>v/25|0)}
   else{const d=x.getImageData(Math.max(0,Math.min(199,s[0]|0)),Math.max(0,Math.min(239,s[1]|0)),1,1).data;if(!d[3])return;rgb=[d[0],d[1],d[2]]}
   col='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');$('col').value=col;if(!mv)setTool('b');return}
  x.globalCompositeOperation=tool==='e'?'destination-out':'source-over';x.strokeStyle=x.fillStyle=col;x.lineWidth=bs;x.lineCap='round';
  const a=lp||s;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(s[0]+.01,s[1]);x.stroke();lp=s}
 else if(!mv&&ph==='hunt'&&me.r==='s'&&cd<=0){const w=toW(e.clientX,e.clientY);cd=1.4;flash={x:w[0],y:w[1],t:.3};send({t:'shoot',x:w[0],y:w[1]})}}
cv.addEventListener('pointerdown',e=>{down=true;lp=null;ptr(e,0)});
cv.addEventListener('pointermove',e=>{if(down)ptr(e,1)});
addEventListener('pointerup',()=>{down=false;lp=null});
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('col').oninput=e=>{col=e.target.value;if(tool!=='b'&&tool!=='e')setTool('b')};
$('bs').oninput=e=>bs=+e.target.value;
$('fill').onclick=()=>{const x=tgt().getContext('2d');x.globalCompositeOperation='source-over';x.fillStyle=col;x.fillRect(0,0,200,240)};
$('clr').onclick=()=>tgt().getContext('2d').clearRect(0,0,200,240);
$('zm').onclick=()=>Z=Z===2?3:Z===3?4.5:2;
POSES.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p[0];$('ps').appendChild(o)});
$('ps').onchange=e=>{me.pi=+e.target.value;me.pose=POSES[me.pi][1]};
$('fl').onclick=()=>me.f*=-1;
$('unf').onclick=()=>{me.fx=0};
$('fixb').onclick=()=>{me.fx=1;me.vx=me.vy=0;me.pi=0;me.pose=POSES[0][1];$('ps').value=0};
$('ok').onclick=()=>{edOpen=false;send({t:'av',img:me.av.toDataURL()})};
$('ae').onclick=()=>edOpen=true;
$('st').onclick=startGame;
$('go').onclick=join;
$('nm').value=localStorage.mckrN||'';
{const q=new URLSearchParams(location.search).get('room');if(q)$('rm').value=q}

/* ---------- 描画 ---------- */
const sh=(el,v)=>{const d=v?(el.dataset.d||'block'):'none';if(el._d!==d){el._d=d;el.style.display=d}};
$('menu').dataset.d='flex';$('lob').dataset.d='flex';$('tb').dataset.d='flex';$('wait').dataset.d='flex';
let last=0;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;tn=t/1000;if(me&&me.id&&ST){upd(dt);draw(dt)}requestAnimationFrame(loop)}
function canMove(){return!isEd()&&(ph==='lobby'||(ph==='paint'&&me.r==='h'&&!me.fx)||(ph==='hunt'&&me.r==='s')||(ph==='reveal'&&me.r!==''))}
function upd(dt){
 rem=Math.max(0,rem-dt);cd-=dt;banT-=dt*1000;if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
 const mv=canMove();
 if(mv){phys(me,dt,inp.x||kx,inp.y||ky,jmp)}jmp=false;
 for(const id in P){const p=P[id];if(p===me)continue;const k=Math.min(1,dt*14);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}
 const pm=isPm(),k0=H_/760;let k=pm?k0*Z:k0;
 if(pm){CAM.cx=me.x;CAM.cy=me.y-60}else{const f=Math.min(1,dt*6);CAM.cx+=(me.x-CAM.cx)*f;CAM.cy+=(me.y-70-CAM.cy)*f}
 const vw=W_/k,vh=H_/k;CAM.k=k;CAM.x=vw>=WW?WW/2:Math.max(vw/2,Math.min(WW-vw/2,CAM.cx));CAM.y=vh>=WH?WH/2:Math.max(vh/2,Math.min(WH-vh/2,CAM.cy));
 const ed=isEd();
 if(ed){CAM.k=H_*.62/124;CAM.x=0;CAM.y=0}
 const play=ph==='lobby'||me.r!=='';
 sh($('menu'),ph==='menu');
 sh($('lob'),ph==='lobby'&&!edOpen);sh($('st'),!!me.host);
 sh($('tb'),ed||pm);document.querySelectorAll('.hd').forEach(b=>sh(b,pm));sh($('ok'),ph==='lobby'&&edOpen);
 sh($('stk'),mv);sh($('jb'),mv);sh($('fixb'),ph==='paint'&&me.r==='h'&&!me.fx);
 sh($('wait'),!play);
 sh($('hud'),ph!=='menu');sh($('ros'),ph!=='menu');sh($('ban'),banT>0);
 $('ban').textContent=ban;
 const nh=Object.values(P).filter(p=>p.r==='h').length;
 $('hud').textContent=(LBL[ph]||'')+(ph==='lobby'?'':'　'+fmt(rem))+(me.r==='s'?'　👹鬼':me.r==='h'?'　🫥かくれ':'')+(ph==='hunt'||ph==='reveal'?'　のこり'+nh+'人':'')+(ph==='hunt'&&me.r==='s'?(cd>0?'　装填中…':'　🔫OK'):'');
 $('ros').innerHTML=Object.values(P).map(p=>(p.id===base?'👑':'')+(p.r==='s'?'👹':p.r==='h'?'🫥':'・')+p.n.replace(/</g,'&lt;')+(p===me?'（あなた）':'')).join('<br>');
 $('st').textContent='ゲーム開始（'+Object.keys(P).length+'人）'}
function figOf(p){const hid=p.r==='h';return{pose:p.fx?p.pose:anim(p),img:hid?(p===me?me.hide:p.img):p.imgAv||(p===me?me.av:null)}}
function draw(dt){
 g.setTransform(D,0,0,D,0,0);g.fillStyle='#1d2433';g.fillRect(0,0,W_,H_);
 const ed=isEd();
 if(ph==='lobby'||me.r!==''){
  const k=CAM.k;
  if(ed){g.fillStyle='#39425a';g.fillRect(0,0,W_,H_);g.setTransform(D*k,0,0,D*k,D*W_/2,D*H_/2);drawFig(g,STAND,me.av,0,62,1)}
  else{
   const vw=W_/k,vh=H_/k;g.drawImage(ST.cv,CAM.x-vw/2,CAM.y-vh/2,vw,vh,0,0,W_,H_);
   g.setTransform(D*k,0,0,D*k,D*(W_/2-CAM.x*k),D*(H_/2-CAM.y*k));
   const seeHid=ph!=='paint'||me.r==='h';
   const lst=Object.values(P).filter(p=>p!==me).concat([me]);
   for(const p of lst){
    if(p.r==='h'&&!seeHid)continue;if(p.r===''&&ph!=='lobby')continue;
    if(ph==='paint'&&p.r==='s')continue;
    const f=figOf(p);drawFig(g,f.pose,f.img,p.x,p.y,p.f||1);
    if(p.r!=='h'||ph==='lobby'){g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#000';g.strokeText(p.n,p.x,p.y-135);g.fillText(p.n,p.x,p.y-135)}}
   if(flash){g.fillStyle='#ffd23fcc';for(let i=0;i<9;i++){g.beginPath();g.arc(flash.x+Math.cos(i*2.4)*i*5,flash.y+Math.sin(i*2.4)*i*5,6,0,7);g.fill()}}
   if(ph==='reveal'){const q=performance.now()/250;
    for(const p of Object.values(P)){if(p.r!=='h')continue;const cy=p.y-60,rr=80+8*Math.sin(q);
     g.strokeStyle=`hsl(${q*30%360},100%,60%)`;g.lineWidth=7;g.beginPath();g.arc(p.x,cy,rr,0,7);g.stroke();
     g.fillStyle='#ffd23f';g.beginPath();g.moveTo(p.x,cy-rr-4);g.lineTo(p.x-18,cy-rr-34);g.lineTo(p.x+18,cy-rr-34);g.fill();
     g.fillStyle='#fff';g.font='bold 26px sans-serif';g.textAlign='center';g.strokeStyle='#000';g.lineWidth=5;g.strokeText('ここ！ '+p.n,p.x,cy-rr-42);g.fillText('ここ！ '+p.n,p.x,cy-rr-42)}
    g.setTransform(D,0,0,D,0,0);
    for(const p of Object.values(P)){if(p.r!=='h')continue;const sx=(p.x-CAM.x)*k+W_/2,sy=(p.y-60-CAM.y)*k+H_/2;
     if(sx<0||sx>W_||sy<0||sy>H_){const ex=Math.max(30,Math.min(W_-30,sx)),ey=Math.max(60,Math.min(H_-60,sy));g.fillStyle='#ff5d73';g.beginPath();g.arc(ex,ey,16,0,7);g.fill();g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';g.fillText(p.n,ex,ey+32)}}}
  }}
 if(ph==='hunt'&&me.r==='s'){g.setTransform(D,0,0,D,0,0);g.fillStyle='#fff9';g.font='14px sans-serif';g.textAlign='center';g.fillText('怪しい所をタップして撃つ（外すと3秒装填）',W_/2,H_-18)}}
requestAnimationFrame(loop);
</script></body></html>
