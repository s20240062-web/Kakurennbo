 ['しゃがむ',[0,0,0,0,0,0,0,0,0]],
 ['片手',[0,0,0,0,0,0,0,0,0]],
 ['走る',[0,0,0,0,0,0,0,0,0]],
 ['大の字',[0,0,0,0,0,0,0,0,0]]
];
function setPose(f,p){
 if(!f.ready)return;
 const b=f.bones;
 const rot=(name,x,y,z)=>{if(b[name])b[name].rotation.set(x,y,z)};
 const idx=PO.findIndex(q=>JSON.stringify(q[1])===JSON.stringify(p)),pose=idx<0?0:idx; 
 const neutral=()=>{Object.values(b).forEach(o=>o.rotation.set(0,0,0))};
 neutral();
 const arm=(side,shoulder,elbow=0)=>{rot(side+'_Upperarm',0,0,shoulder);rot(side+'_Forearm',0,0,elbow)};
 const leg=(side,hip,knee=0)=>{rot(side+'_Thigh',knee,0,hip);rot(side+'_Calf',-knee,0,0)};
 if(pose===1){arm('L',-1.45);arm('R',1.45)}
 if(pose===2){arm('L',-2.65);arm('R',2.65)}
 if(pose===3){leg('L',-.25,.9);leg('R',.25,.9);rot('Spine01',-.25,0,0)}
 if(pose===4){leg('L',-.65,1.2);leg('R',.65,1.2);rot('Spine01',.25,0,0)}
 if(pose===5)arm('R',2.7,-.3);
 if(pose===6){leg('L',-.55,.8);leg('R',.55,.1);arm('L',-.6);arm('R',.6)}
 if(pose===7){arm('L',-2.1);arm('R',2.1);leg('L',-.5);leg('R',.5)}
 f.pose=p;
}
const matMode=(f,l)=>f.m.forEach(m=>{m.material.color.set(l?0xff7777:0xffffff)});
const wipe=f=>{if(!f.ready)return;const u=f.m[0].userData;u.cx.fillStyle='#fff';u.cx.fillRect(0,0,1024,1024);u.t.needsUpdate=true};
const loadTex=(f,a)=>{if(!f.ready||!a||!a[0])return;const im=new Image();im.onload=()=>{const u=f.m[0].userData;u.cx.clearRect(0,0,1024,1024);u.cx.drawImage(im,0,0,1024,1024);u.t.needsUpdate=true};im.src=a[0]};
// ---------- 状態 ----------
let ph='menu',tm=0,P={},RM={},surv=[],myId,isHost,hostConn,peer,locked=0,tool=0,az=0,finSent=0,cd=0,jx=0,jy=0,HL=[],up=0,dn=0;
const K={};const role=()=>(P[myId]&&P[myId].role)||'free';
const getRM=id=>RM[id]||(RM[id]={f:(f=>{sc.add(f.root);return f})(mkFig(id)),s:null});
const walk=()=>ph!='menu'&&(role()=='free'||ph=='lobby'||ph=='reveal'||(ph=='paint'&&role()=='hider'&&!locked)||(ph=='seek'&&role()=='oni'));
const paintUI=()=>ph=='paint'&&role()!='free';const tps=()=>role()=='hider'&&(ph=='paint'||ph=='seek'),studio=()=>ph=='paint'&&role()=='oni';
let toastT;function show(t,ms=2500){$('msg').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>$('msg').textContent='',ms)}
const PN={lobby:'待機中',paint:'ペイント',seek:'探索',reveal:'答え合わせ'};
function ui(){const w=walk(),pu=paintUI();$('joy').hidden=!w;$('pnt').hidden=!pu;$('act').hidden=!(w||pu);$('bj').hidden=!w;$('bs').hidden=!(ph=='seek'&&role()=='oni');
 $('bl').hidden=!(ph=='paint'&&role()=='hider');$('bl').textContent=locked?'解除して動く':'ここに固定';$('pz').hidden=role()=='oni';$('menu').hidden=ph!='menu';
 $('ch').hidden=!(w||ph=='seek');$('lobby').hidden=ph!='lobby';{const o=pu?'200px':'';$('joy').style.bottom=o;$('act').style.bottom=o}
 if(ph=='lobby'){$('pl').innerHTML='<b>参加者</b><br>'+Object.values(P).map(p=>p.n).join('<br>');$('st').hidden=!isHost;$('lw').textContent=isHost?(Object.keys(P).length<2?'2人以上で開始できます':''):'ホストの開始を待っています…'}hud()}
function hud(){$('top').textContent=(PN[ph]||'')+(ph=='lobby'||ph=='menu'?'':' '+Math.max(0,Math.ceil(tm))+'秒')+(role()=='oni'?'  👹鬼':role()=='hider'?'  🫥隠れる側':'')}
// ---------- 通信 ----------
const bc=d=>{for(const i in conns)conns[i].open&&conns[i].send(d);onMsg(d)};
const tell=d=>isHost?onH(myId,d):hostConn&&hostConn.open&&hostConn.send(d);
let conns={},phh='lobby',T0=0,SS={},FIN={};
const cph=()=>phh=='collect'?'paint':phh;const pbc=x=>bc(Object.assign({k:'ph',ph:cph(),P},x||{}));
function start(){const ids=Object.keys(P);if(ids.length<2)return;const o=ids[ids.length*Math.random()|0];ids.forEach(i=>{P[i].role=i==o?'oni':'hider';delete P[i].found});FIN={};phh='paint';T0=60;pbc()}
function endSeek(){surv=Object.keys(P).filter(i=>P[i].role=='hider');phh='reveal';T0=surv.length?25:6;pbc({surv})}
function onH(id,d){
 if(d.k=='join'){P[id]={n:d.n,role:'free'};if(phh!='lobby'&&conns[id])for(const i in FIN)conns[id].send(FIN[i]);pbc()}
 else if(d.k=='st')SS[id]=d.s;
 else if(d.k=='fin'){d.id=id;FIN[id]=d;bc(d)}
 else if(d.k=='start'&&id==myId)start();
 else if(d.k=='shot'&&phh=='seek'&&P[id]&&P[id].role=='oni'&&P[d.t]&&P[d.t].role=='hider'){P[d.t].role='oni';P[d.t].found=1;delete FIN[d.t];bc({k:'found',id:d.t,P})}}
function hostLoop(){setInterval(()=>{bc({k:'S',s:SS})},100);
 setInterval(()=>{if(phh=='lobby')return;T0-=.2;
  if(phh=='paint'&&T0<=0){phh='collect';T0=2.5}
  else if(phh=='collect'&&T0<=0){phh='seek';T0=240;pbc()}
  else if(phh=='seek'&&(T0<=0||!Object.values(P).some(p=>p.role=='hider')))endSeek();
  else if(phh=='reveal'&&T0<=0){phh='lobby';for(const i in P)P[i].role='free';FIN={};pbc()}
  bc({k:'T',t:phh=='collect'?0:T0})},200)}
function join(){const name=$('nm').value.trim()||('ゲスト'+(Math.random()*99|0));localStorage.mkk=name;const pid='mekkakakurenbo-'+($('rm').value.trim()||'1234');
 const pe=new Peer(pid);peer=pe;
 pe.on('open',id=>{isHost=true;myId=id;pe.on('connection',c=>{conns[c.peer]=c;c.on('data',d=>onH(c.peer,d));c.on('close',()=>{delete conns[c.peer];delete P[c.peer];delete SS[c.peer];delete FIN[c.peer];pbc()})});
  P[myId]={n:name,role:'free'};hostLoop();pbc()});
 pe.on('error',e=>{if(e.type=='unavailable-id'&&!myId){const p2=new Peer();p2.on('open',id=>{myId=id;hostConn=p2.connect(pid,{reliable:true});hostConn.on('open',()=>hostConn.send({k:'join',n:name}));hostConn.on('data',onMsg);hostConn.on('close',()=>{alert('ホストとの接続が切れました');location.reload()})});p2.on('error',e=>alert('接続エラー:'+e.type))}else if(e.type!='unavailable-id')alert('接続エラー:'+e.type)})}
function tp(s){me.x=s[0];me.z=s[1];me.y=0;me.vy=0;me.yaw=Math.random()*6.28;me.pit=0}
function clearHL(){HL.forEach(o=>sc.remove(o));HL=[]}
function mats(){for(const i in RM)matMode(RM[i].f,P[i]&&P[i].role=='oni')}
function enter(p){ph=p;finSent=0;clearHL();
 if(p=='lobby'||p=='paint'){for(const i in RM){wipe(RM[i].f);setPose(RM[i].f,PO[0][1])}locked=0;tool=0;az=0;setTool(0)}
 if(p=='lobby')tp(spot());
 if(p=='paint'){if(role()=='oni'){me.pit=.2;show('あなたは鬼！\n待ち時間にアバターを描こう')}else{tp(spot());show('隠れる場所へ移動しながら描ける！\n決まったら「ここに固定」。壁際の▲▼で登れます',4500)}}
 if(p=='seek'){if(role()=='oni'){tp(spot());show('見つけたら🔫で撃て！')}else show('息をひそめて…')}
 if(p=='reveal'){locked=0;surv.forEach(i=>[[new THREE.BoxGeometry(1,2,1),1,.4],[new THREE.CylinderGeometry(.06,.06,16,8),8,.6]].forEach(([g,h,o])=>{const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffee00,transparent:true,opacity:o,depthTest:false}));m.renderOrder=999;m.userData={id:i,h,o};sc.add(m);HL.push(m)}));
  show(surv.length?'隠れきったのは…\n'+surv.map(i=>P[i]?P[i].n:'?').join('、')+'！':'全員見つかった！',9000)}
 mats();ui()}
function onMsg(m){
 if(m.k=='ph'){const ch=m.ph!=ph;P=m.P;if(m.surv)surv=m.surv;for(const i in RM)if(!P[i]){sc.remove(RM[i].f.root);delete RM[i]}for(const i in P)getRM(i);if(ch)enter(m.ph);else ui()}
 else if(m.k=='T'){tm=m.t;hud();if(ph=='paint'&&tm<=0&&!finSent)sendFin()}
 else if(m.k=='S'){for(const i in m.s)if(i!=myId)getRM(i).s=m.s[i]}
 else if(m.k=='fin'){if(m.id!=myId)loadTex(getRM(m.id).f,m.tex)}
 else if(m.k=='found'){P=m.P;const r=getRM(m.id);if(m.id==myId){locked=0;show('見つかった！\nあなたも鬼になった👹')}else show((P[m.id]?P[m.id].n:'')+' が見つかった！');setPose(r.f,PO[0][1]);mats();ui()}}
function doLock(){locked=1;me.vy=0;me.fy=me.yaw}
function sendFin(){finSent=1;if(role()=='hider')locked=1;tell({k:'fin',tex:[getRM(myId).f.cv[0].toDataURL()]});ui()}
setInterval(()=>{if(ph!='menu'&&myId){const r=getRM(myId);tell({k:'st',s:[...(studio()?[0,200,0,0]:[me.x,me.y,me.z,me.fy]),me.pit,r.f.pose]})}},100);
// ---------- 操作 ----------
const cv=$('c'),rc=new THREE.Raycaster(),v2=new THREE.Vector2();let lp={};
function view(dx,dy){if(studio()){az-=dx*.01;me.pit=Math.max(-.5,Math.min(1,me.pit-dy*.005))}else{me.yaw-=dx*.005;me.pit=Math.max(-1.4,Math.min(1.4,me.pit-dy*.005))}}
function paint(e,p){const f=RM[myId].f;if(!f.ready)return 0;v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(v2,cam);const h=rc.intersectObjects(f.m,false)[0];if(!h||!h.uv){p.u=null;return 0}
 const m=h.object,u=m.userData,x=h.uv.x*1024,y=(1-h.uv.y)*1024,g=u.cx;g.strokeStyle=$('col').value;g.lineWidth=$('sz').value*5;g.lineCap='round';g.beginPath();
 if(p.u&&p.u.m==m&&Math.abs(p.u.x-x)<320){g.moveTo(p.u.x,p.u.y);g.lineTo(x,y)}else{g.moveTo(x,y);g.lineTo(x+.01,y)}g.stroke();u.t.needsUpdate=true;p.u={m,x,y};return 1}
function pick(e){const f=RM[myId].f;f.root.visible=false;rd.render(sc,cam);const gl=rd.getContext(),b=new Uint8Array(4),x=Math.floor(e.clientX/innerWidth*gl.drawingBufferWidth),y=gl.drawingBufferHeight-1-Math.floor(e.clientY/innerHeight*gl.drawingBufferHeight);
 gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,b);f.root.visible=true;$('col').value='#'+[b[0],b[1],b[2]].map(v=>v.toString(16).padStart(2,'0')).join('')}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=lp[e.pointerId]={x:e.clientX,y:e.clientY,u:null,v:0};if(paintUI()){if(!RM[myId].f.ready){show('モデルを読み込み中です');return}if(tool==1)pick(e);else if(tool==0)p.v=!paint(e,p)}};
cv.onpointermove=e=>{const p=lp[e.pointerId];if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(paintUI()){if(!RM[myId].f.ready)return;if(tool==0){if(p.v)view(dx,dy);else paint(e,p)}else if(tool==1)pick(e);else view(dx,dy)}else if(ph!='menu')view(dx,dy)};
cv.onpointerup=cv.onpointercancel=e=>{delete lp[e.pointerId]};
const J=$('joy');let jp=null;
function jm(e){const r=J.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jx=x;jy=y;$('knob').style.transform=`translate(${x*35}px,${y*35}px)`}
J.onpointerdown=e=>{jp=e.pointerId;J.setPointerCapture(jp);jm(e)};J.onpointermove=e=>{if(e.pointerId==jp)jm(e)};J.onpointerup=J.onpointercancel=()=>{jp=null;jx=jy=0;$('knob').style.transform=''};
let jump=0;$('bj').onpointerdown=()=>jump=1;$('bu').onpointerdown=()=>up=1;$('bd').onpointerdown=()=>dn=1;addEventListener('pointerup',()=>{up=dn=0});
$('bl').onclick=()=>{if(locked)locked=0;else doLock();ui()};
$('bs').onpointerdown=shoot;
function shoot(){if(cd>0||ph!='seek'||role()!='oni')return;cd=.9;$('fl').style.opacity=.7;setTimeout(()=>$('fl').style.opacity=0,90);
 const tg=[];for(const i in RM)if(i!=myId&&P[i]&&P[i].role=='hider'&&RM[i].f.root.visible)tg.push(...RM[i].f.m);const all=wm.concat(tg),hs=new Set();rc.far=40;
 for(let i=0;i<9;i++){const sp=i?.07:0,d=new THREE.Vector3((Math.random()-.5)*sp,(Math.random()-.5)*sp,-1).applyQuaternion(cam.quaternion).normalize();rc.set(cam.position,d);const h=rc.intersectObjects(all,false)[0];if(h&&h.object.userData.pid)hs.add(h.object.userData.pid)}
 if(hs.size)hs.forEach(t=>tell({k:'shot',t}));else show('はずれ…',800)}
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t==t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(+b.dataset.t));
$('clr').onclick=()=>wipe(RM[myId].f);
PO.forEach(([n,p])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setPose(RM[myId].f,p);$('pz').appendChild(b)});
$('st').onclick=()=>tell({k:'start'});$('go').onclick=join;$('nm').value=localStorage.mkk||'';
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')jump=1;if(e.code=='Enter')shoot()});addEventListener('keyup',e=>K[e.code]=0);
// ---------- ループ ----------
const gun=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.8),lam(0x222222));gun.position.set(.25,-.22,-.5);cam.add(gun);
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;cd-=dt;
 const w=walk(),nr=w&&nearW();$('bu').hidden=$('bd').hidden=!nr;if(!nr)up=dn=0;
 if(ph!='menu'&&!studio()){let mx=0,mz=0;
  if(w){const ix=jx+(K.KeyD?1:0)-(K.KeyA?1:0),fw=-jy+(K.KeyW?1:0)-(K.KeyS?1:0),s=Math.sin(me.yaw),c=Math.cos(me.yaw),l=Math.max(1,Math.hypot(ix,fw)),sp=(role()=='oni'?5.5:4.5)*dt/l;mx=(c*ix-s*fw)*sp;mz=(-s*ix-c*fw)*sp;if(jump&&me.on){me.vy=7;me.on=0}}
  jump=0;if(!(ph=='paint'&&role()=='hider'&&locked))mv(mx,mz,dt,up&&nr,dn&&nr);if(tps()){if(locked)me.fy=me.yaw;else if(mx||mz)me.fy=Math.atan2(mx,mz)}else me.fy=me.yaw+Math.PI}
 for(const id in RM){const r=RM[id],f=r.f;let p,v=0;
  if(id==myId){if(studio()){p=[0,200,0,0];v=1}else if(tps()){p=[me.x,me.y,me.z,me.fy];v=1}}
  else if(r.s&&!studio()&&!(r.s[1]>100)){p=r.s;v=1;if(r.s[5])setPose(f,r.s[5])}
  f.root.visible=!!v;if(v){f.root.position.set(p[0],p[1],p[2]);f.root.rotation.y=p[3]}}
 HL.forEach(o=>{const u=o.userData,p=u.id==myId?[me.x,me.y,me.z]:(RM[u.id]&&RM[u.id].s);if(p)o.position.set(p[0],p[1]+u.h,p[2]);o.material.opacity=u.o*(.6+.4*Math.sin(now/200))});
 gun.visible=ph=='seek'&&role()=='oni';
 if(studio()){const p=me.pit,d=2.8;cam.position.set(Math.sin(az)*Math.cos(p)*d,201+Math.sin(p)*d,Math.cos(az)*Math.cos(p)*d);cam.lookAt(0,201,0)}
 else if(tps()){const p=Math.max(-.3,Math.min(1.2,-me.pit)),d=2.6,t=new THREE.Vector3(me.x,me.y+1.2,me.z),dir=new THREE.Vector3(Math.sin(me.yaw)*Math.cos(p),Math.sin(p),Math.cos(me.yaw)*Math.cos(p));
  rc.set(t,dir);rc.far=d+.3;const h=rc.intersectObjects(wm,false)[0];cam.position.copy(t).addScaledVector(dir,h?Math.max(.5,h.distance-.25):d);cam.lookAt(t)}
 else{cam.position.set(me.x,me.y+1.55,me.z);cam.rotation.set(me.pit,me.yaw,0)}
 rd.render(sc,cam)}
requestAnimationFrame(loop);
